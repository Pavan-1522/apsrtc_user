<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Bus Pass Verification System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .hero {
            background: linear-gradient(45deg, #1a73e8, #ff6b6b);
            color: #fff;
            padding: 80px 0;
        }

        .contact-form {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: -50px;
        }

        .contact-form h2 {
            margin-bottom: 20px;
            color: #1a73e8;
        }

        .contact-form .form-control {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 10px;
        }

        .contact-form .form-control:focus {
            border-color: #1a73e8;
            box-shadow: none;
        }

        .contact-form .btn-primary {
            background-color: #1a73e8;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
        }

        .contact-form .btn-primary:hover {
            background-color: #1557a3;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .contact-form {
                padding: 15px;
            }

            .navtxt {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand navtxt" href="#">Smart Bus Pass Verification System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item dropdown" id="login-logout-section">
                        <!-- Dropdown will be populated dynamically -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero text-center">
        <div class="container">
            <h1 class="display-4">Contact Us</h1>
            <p class="lead">We're here to help! Reach out to us for any queries or support.</p>
        </div>
    </section>

    <!-- Contact Form Section -->
    <section class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="contact-form">
                    <h2>Get in Touch</h2>
                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" placeholder="Enter the subject" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Enter your message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Smart Bus Pass Verification System. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Check if user email exists in local storage
        const userData = JSON.parse(localStorage.getItem('user'));

        if (!userData || !userData.email) {
            // Redirect to index.html if no email is found
            window.location.href = "index.html";
        } else {
            // Display the user's email in the navbar
            const loginLogoutSection = document.getElementById('login-logout-section');
            loginLogoutSection.innerHTML = `
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    ${userData.email}
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                    <li><a class="dropdown-item" href="#" id="logout-btn">Logout</a></li>
                </ul>
            `;
        }

        // Logout Functionality
        document.addEventListener('click', function (event) {
            if (event.target && event.target.id === 'logout-btn') {
                // Remove user data from local storage
                localStorage.removeItem('user');
                // Redirect to index.html
                window.location.href = "index.html";
            }
        });

        // Contact Form Submission
        document.getElementById('contactForm').addEventListener('submit', function (event) {
            event.preventDefault();
            alert('Thank you for contacting us! We will get back to you soon.');
            // Clear the form
            document.getElementById('contactForm').reset();
        });
    </script>
</body>
</html>
