<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(45deg, #ff3333, #0066cc, #99ff99);
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            background-color: #282c34;
            margin-bottom: 20px; /* Space between navbar and content */
        }

        .navbar a {
            color: white;
        }

        /* Login Container */
        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 1.5s ease-in-out;
        }

        .login-container h3 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #333;
        }

        /* Buttons */
        .btn-custom {
            background-color: #0069d9;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .btn-google {
            background-color: #db4437;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        .btn-google:hover {
            background-color: #c1351d;
        }

        /* Links */
        .forgot-password, .create-user {
            color: #0069d9;
            font-size: 1rem;
            text-decoration: none;
            margin-top: 10px;
        }

        .forgot-password:hover, .create-user:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #282c34;
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .tag{
            color: black;
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">Smart Bus Pass Verification System</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="login-container">
            <h3>Welcome Back!</h3>
            <P class="tag">to SMART BUS PASS VERIFICATION SYSTEM</P>

            <!-- Google Sign-In Button -->
            <button class="btn btn-google" id="google-sign-in">
                <i class="fab fa-google mr-2"></i> Sign in with Google
            </button>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-custom mb-2">Login</button>
            </form>

            <!-- Forgot Password and Create Account Links -->
            <a href="#" class="forgot-password">Forgot Password?</a>
            <a href="signup.html" class="create-user">Create a new account</a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 SMART BUS PASS VERIFICATION SYSTEM. All Rights Reserved.</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        // Firebase Configuration
        const firebaseConfig = {
      apiKey: "AIzaSyA02GfjPGm1X8He9bLkrfkyBKWYgmMc98Q",
      authDomain: "buspass-2025.firebaseapp.com",
      databaseURL: "https://buspass-2025-default-rtdb.firebaseio.com",
      projectId: "buspass-2025",
      storageBucket: "buspass-2025.appspot.com",
      messagingSenderId: "417197327685",
      appId: "1:417197327685:web:42d2d9e773512f7ba1ea2c",
      measurementId: "G-475C145WWK"
    };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // Google Sign-In
        document.getElementById('google-sign-in').addEventListener('click', function () {
            const provider = new firebase.auth.GoogleAuthProvider();

            auth.signInWithPopup(provider).then((result) => {
                const user = result.user;
                const email = user.email;
                const uid = user.uid;

                // Check if the user exists in the database
                database.ref('users/' + uid).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        // Existing user, redirect to home
                        localStorage.setItem('user', JSON.stringify({ uid, email }));
                        window.location.href = "home.html";
                    } else {
                        // New user, redirect to create profile page
                        localStorage.setItem('user', JSON.stringify({ uid, email }));
                        window.location.href = "create.html";
                    }
                }).catch((error) => {
                    console.error("Database check error:", error);
                    alert(error.message);
                });
            }).catch((error) => {
                console.error("Google Sign-In Error:", error);
                alert(error.message);
            });
        });

        // Email Sign-In
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password).then((userCredential) => {
                const user = userCredential.user;
                // Save user data in localStorage
                localStorage.setItem('user', JSON.stringify(user));
                console.log(user);
                window.location.href = "home.html";  // Redirect to dashboard
            }).catch((error) => {
                console.log(error.message);
                alert(error.message)
            });
        });

        // Forgot Password
        document.querySelector('.forgot-password').addEventListener('click', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (email) {
                auth.sendPasswordResetEmail(email).then(() => {
                    alert("Password reset email sent.");
                }).catch((error) => {
                    console.log(error.message);
                });
            } else {
                alert("Please enter your email address.");
            }
        });

        // Create User
        document.querySelector('.create-user').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = "signup.html";  // Redirect to signup page
        });
        
    </script>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
